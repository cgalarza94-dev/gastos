<!DOCTYPE html>
<html>
  <body>
    <h1 id="titulo">Hola</h1>
    <button id="boton">Cambiar</button>
    <script>
      const boton = document.getElementById("boton");
      const titulo = document.getElementById("titulo");
      boton.addEventListener("click", () => {
        titulo.textContent = "Cambiado!";
      });
    </script>
  </body>
</html>
